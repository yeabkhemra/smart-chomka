    <script>
      const latestAppUrl = "./index.html?v=63#home";
      const safetyRedirect = setTimeout(() => {
        window.location.replace(latestAppUrl);
      }, 2500);

      async function resetAppCache() {
        const status = document.querySelector("#status");

        try {
          if ("serviceWorker" in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map((registration) => registration.unregister()));
          }

          if ("caches" in window) {
            const keys = await caches.keys();
            await Promise.all(keys.map((key) => caches.delete(key)));
          }

          status.textContent = "ážšáž½áž…ážšáž¶áž›áŸ‹áŸ” áž€áŸ†áž–áž»áž„áž”áž¾áž€ Smart Chomka version ážáŸ’áž˜áž¸...";
        } catch (error) {
          console.warn("Cache reset failed", error);
          status.textContent = "áž”áž¾áž€ version ážáŸ’áž˜áž¸...";
        }

        clearTimeout(safetyRedirect);
        window.location.replace(latestAppUrl);
      }

      resetAppCache();
    </script>
