<!doctype html>
<html lang="km">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#2f7d32">
    <title>Smart Chomka PDF</title>
    <link rel="stylesheet" href="./pdf-viewer.css?v=66">
  </head>
  <body>
    <main class="pdf-shell">
      <header class="pdf-header">
        <a class="back-link" href="./index.html?v=66">ត្រឡប់</a>
        <div>
          <p>Smart Chomka Reference</p>
          <h1 id="viewerTitle">ឯកសារយោង</h1>
        </div>
        <a class="source-link" id="sourceLink" target="_blank" rel="noopener noreferrer">បើកឯកសារដើម</a>
      </header>

      <section class="pdf-status" id="viewerStatus" aria-live="polite">
        កំពុងបើកឯកសារ...
      </section>

      <section class="pdf-pages" id="pdfPages"></section>

      <section class="pdf-fallback hidden" id="pdfFallback">
        <h2>មិនអាចបង្ហាញ PDF ក្នុងទូរស័ព្ទនេះបាន</h2>
        <p>សូមចុចបើកឯកសារដើម ឬពិនិត្យអ៊ីនធឺណិត ប្រសិនបើឯកសារនេះមិនមែនជាឯកសារ Offline។</p>
      </section>
    </main>

    <script type="module" src="./pdf-viewer.js?v=66"></script>
  </body>
</html>
